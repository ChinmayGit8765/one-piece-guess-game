name: daily pick & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 21 * * *" # 21:15 UTC ≈ 7–8am Melbourne — new character every morning
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Cron / manual runs pick a new character; plain pushes deploy as-is.
      - name: Pick character of the day
        if: github.event_name != 'push'
        run: python3 scripts/pick_daily.py

      - name: Commit today's pick
        if: github.event_name != 'push'
        run: |
          git config user.name "one-piece-guess-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "pick unchanged, nothing to commit"
          else
            git commit -m "daily: new character [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
